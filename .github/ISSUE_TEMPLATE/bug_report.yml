name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did the app do instead of what you expected?
      placeholder: I loaded the cooking club sample, chose fixed windows, and the chunk count stayed at 31.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142 on Windows 11
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything red in the browser developer console. Optional but very helpful.
      render: shell
