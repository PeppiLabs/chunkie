name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token each job receives can only read the repository. Nothing here needs
# to write, so a compromised step or dependency cannot use it to push code.
permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit rather than a tag, because a tag can be
      # moved to point at different code and a commit cannot. Dependabot keeps
      # these current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check that no Node only packages reached the browser bundle
        run: |
          if grep -rq "onnxruntime-node" dist/; then
            echo "onnxruntime-node ended up in the browser bundle"
            exit 1
          fi
          echo "Bundle is clean"
