name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check that no Node only packages reached the browser bundle
        run: |
          if grep -rq "onnxruntime-node" dist/; then
            echo "onnxruntime-node ended up in the browser bundle"
            exit 1
          fi
          echo "Bundle is clean"
