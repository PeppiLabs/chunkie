# Opens pull requests when a dependency or a pinned action has a newer
# version, including security fixes. Nothing merges on its own: each one goes
# through review and CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint only supports TypeScript below 6.1, so a newer
      # TypeScript breaks the install before lint even runs. Remove this once
      # typescript-eslint's peer range covers the newer version.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
