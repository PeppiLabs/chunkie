# Render blueprint for Chunkie.
#
# The whole app is static: the embedding model and the vector search both run
# in the visitor's browser, so there is no server process, no database, and
# nothing to keep warm. That means it runs on Render's free static site tier.
services:
  - type: web
    name: chunkie
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
    # Single page app: every path serves index.html and React takes over.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The model runtime asks for SharedArrayBuffer, which browsers only grant
      # to cross origin isolated pages. Without these two the WASM backend
      # silently falls back to a slower single threaded path.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Hashed build assets never change, so they can be cached indefinitely.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
